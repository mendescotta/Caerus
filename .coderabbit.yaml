# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Concise and technical. Prioritise memory safety, FFI correctness, privilege
  boundaries and UX consistency. Report actionable defects; avoid style nits.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: true
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  abort_on_close: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  # Every commit on this repository is authored by the maintainer. Keep review
  # comments, but never let CodeRabbit push commits or open fix-up PRs.
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  path_filters:
    - "!**/target/**"
    - "!**/build/**"
    - "!**/builddir/**"
    - "!**/*.svg"
    - "!**/*.png"
    # Generated repository evidence; review the checker and catalog.rs instead.
    - "!scripts/discover/*.json"
    # Keep Cargo.lock in scope for dependency and vulnerability review.

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Caerus is a Rust GTK4 workspace with an unprivileged GUI, a privileged
        helper and generated libxbps bindings. Review changed production code for
        unsafe pointer lifetimes, null checks, buffer sizes, aliasing and ownership.
        Verify CString/CStr and GObject transfer semantics, including
        from_glib_full/from_glib_none, and prevent double-free/double-unref.
        Follow gtk-rs lifecycle conventions when reviewing dispose implementations.
        Prevent unwinding across extern "C" callbacks; flag new panic paths in
        production callbacks and user-triggered UI operations, with failure cases.
        Test assertions and build-script failures are not callback panic defects.
        Request SAFETY reasoning where an unsafe invariant is non-obvious; avoid
        requesting comments or docstrings for self-explanatory code.

    - path: "caerus/src/backend/**"
      instructions: |
        Check libxbps handle/thread ownership, repository callbacks, borrowed
        proplib pointers, iterator cleanup and locks. xbps_pkgpattern_name writes
        into a caller-owned buffer (char*, size_t, const char*) and returns bool.
        Keep blocking repository, dependency, subprocess and file I/O off the GTK
        main thread. Propagate errors without presenting failure as an empty result.
        XBPS and APK are mutually exclusive compile-time backends. Preserve APK
        world-file/removal semantics and disable unsupported Void-only operations.
        For transaction.rs, verify helper ownership/permissions and trusted parent
        paths, validate protocol input and distinguish stderr logs from protocol
        completion. Respect the explicit development-helper opt-in.

    - path: "xbps-sys/**"
      instructions: |
        Bindings are generated by bindgen from the installed libxbps headers;
        changes must match the C ABI, feature macros, types and linking requirements.
        Check ownership against the actual API contract. Do not request manual edits
        to generated target/ bindings or assume a C pointer is owned by Rust.

    - path: "caerus-helper/**"
      instructions: |
        This process runs as root through pkexec and is a privilege boundary.
        Validate GUI commands, package names, options and paths before executing
        any part of a batch. Use fixed executable/argument mappings, option
        terminators and Command arguments; prevent shell and option injection.
        Review executable lookup, inherited environment and file operations for
        attacker-controlled paths, symlink attacks, permission errors and TOCTOU.
        Preserve root checks, minimal privileged scope and truthful partial-failure
        reporting. Do not add new privileged operations without a concrete need.

    - path: "shared/**"
      instructions: |
        Progress messages cross the root-helper/GUI boundary. Validate parsing,
        malformed messages and encoding symmetry. Observed subprocess output must
        not claim premature success or advance an unrelated transaction step.

    - path: "caerus/src/ui/**"
      instructions: |
        UI widgets are built in Rust, with styling in style.css. Check main-thread
        responsiveness, widget ownership, signal lifetimes, stale selection/mark
        state, accessible labels, keyboard navigation and narrow/desktop layouts.
        Preserve dependency/removal previews, essential-package safeguards and
        queued-action semantics. Match existing spacing, styles and navigation.
        For catalog.rs, require exact package names and evidence from official
        binary repositories, with architecture/repository scope stated. Count
        alternative package aliases once, exclude installed-only/unavailable apps,
        use packaged launcher IDs and allow empty IDs when no desktop file ships.

    - path: "**/*.policy"
      instructions: |
        Polkit authorizes /usr/libexec/caerus-helper, never the GUI. System-modifying
        actions must require auth_admin or auth_admin_keep. Flag defaults of yes
        for allow_any, allow_inactive or allow_active and mismatched helper paths.

    - path: "**/*.sh"
      instructions: |
        Honor each script's shebang. #!/bin/sh scripts must be POSIX compatible.
        Review quoting, exit-status handling, temporary files and partial failures.
        For install.sh/get-caerus.sh, preserve the fixed /usr system layout, root
        ownership/modes of helper and policy, install/uninstall symmetry and safe
        user desktop Exec escaping (spaces, quotes, backslashes and percent signs).
        Check the actual scalable icon/desktop/metainfo assets and Cargo artifacts;
        this project does not use Meson, composite UI templates or gresources.

    - path: "scripts/**/*.py"
      instructions: |
        Check subprocess argv, timeouts, exact-name matching, parser failures and
        output provenance. Repository verification must ignore third-party repos,
        report the effective XBPS architecture and avoid installing packages or
        modifying repository configuration. Treat description matches as candidates
        requiring review. Preserve useful offline tests and actionable error output.

    - path: "**/Cargo.toml"
      instructions: |
        Preserve the shared workspace lint policy and feature combinations:
        default XBPS, optional adwaita and APK with --no-default-features. Check
        dependencies and feature gates across GUI, helper and xbps-sys. Keep the
        unprivileged GUI and privileged helper dependency surfaces appropriate.

    - path: ".github/workflows/**"
      instructions: |
        Check event/permission scope, untrusted PR inputs, action references and
        secret exposure. Third-party actions are pinned by commit SHA with a
        version comment. Preserve separate XBPS/APK, adwaita and musl checks.
        JavaScript actions cannot run in the Void musl container, which is why
        that job uses docker run. Native XBPS builds need Void/libxbps and GTK
        build dependencies; failures caused by an unsupported review runner are
        not application defects.

    - path: ".devcontainer/**"
      instructions: |
        Codespaces run Void Linux as root, installing tools with xbps-install.
        Downloads must be version-pinned and checksum-verified. The desktop
        configuration exposes VNC only on localhost through noVNC on port 6080;
        flag anything that binds VNC publicly or stores credentials.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
    description:
      mode: warning

  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
