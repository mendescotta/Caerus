name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-linux:latest-full-x86_64

    steps:
      - name: Install build dependencies
        run: |
          xbps-install -Sy
          xbps-install -uy xbps
          xbps-install -Suy
          xbps-install -y base-devel libxbps-devel gtk4-devel libadwaita-devel pkg-config rust cargo git clang zstd

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --verbose

      # The xbps and apk backends are mutually exclusive, so each is tested on its own.
      - name: Run tests
        run: cargo test --workspace --locked --verbose

      - name: Run tests with adwaita feature
        run: cargo test --workspace --features caerus/adwaita --locked --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build with adwaita feature
        run: cargo build --verbose --features caerus/adwaita

      - name: Clippy with adwaita feature
        run: cargo clippy --workspace --all-targets --features caerus/adwaita -- -D warnings

      - name: Test APK backend
        run: cargo test -p caerus --no-default-features --features apk,adwaita --locked --verbose

      - name: Clippy APK backend
        run: cargo clippy -p caerus --all-targets --no-default-features --features apk,adwaita -- -D warnings
