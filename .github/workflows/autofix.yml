name: Autofix review

on:
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Make autofix script executable
        run: chmod +x scripts/autofix.sh

      - name: Run autofix review generator
        run: ./scripts/autofix.sh

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autofix-review-artifacts
          path: |
            audit-report.json
            .github/auto-fixes/*.md

      - name: Note branch policy
        run: echo "All active work stays on the 0.5-dev branch; this workflow only produces review artifacts, never competing task branches."
