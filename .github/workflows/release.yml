name: Release

# Pushing a v* tag publishes the binary archive, checksum, and build provenance.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-linux:latest-full-x86_64
    steps:
      - name: Install build dependencies
        run: |
          xbps-install -Sy
          xbps-install -uy xbps
          xbps-install -Suy
          xbps-install -y base-devel libxbps-devel gtk4-devel libadwaita-devel pkg-config rust cargo clang zstd git github-cli

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Allow Git operations in the build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag matches the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }

      - name: Build release binary and checksum
        run: |
          cargo build --release --locked -p caerus -p caerus-helper
          mkdir -p dist
          install -m 0755 target/release/caerus dist/caerus
          install -m 0755 target/release/caerus-helper dist/caerus-helper
          cp LICENSE README.md dist/
          tar -C dist -czf dist/caerus-linux-x86_64.tar.gz caerus caerus-helper LICENSE README.md
          sha256sum dist/caerus-linux-x86_64.tar.gz > dist/SHA256SUMS

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/caerus-linux-x86_64.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Caerus ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/caerus-linux-x86_64.tar.gz dist/SHA256SUMS --clobber
